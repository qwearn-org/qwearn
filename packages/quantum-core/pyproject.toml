[project]
name = "quantum-core"
version = "0.1.0"
description = "Qwearn quantum-core — Qiskit abstraction layer and circuit execution engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.3.0",
    "qiskit-aer>=0.15.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Orbital Gradient 1: Cyan to Indigo -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Orbital Gradient 2: Purple to Cyan -->
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Nucleus Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <g transform="translate(0, 0)">
    <!-- Outer Quantum Ring 1 (Tilted Orbit) -->
    <ellipse cx="256" cy="256" rx="180" ry="68" 
             fill="none" 
             stroke="url(#orbitGrad1)" 
             stroke-width="14" 
             stroke-dasharray="800"
             transform="rotate(-30, 256, 256)"
             filter="url(#glow)"
             stroke-linecap="round"/>

    <!-- Outer Quantum Ring 2 (Cross Orbit - forming Q structure) -->
    <ellipse cx="256" cy="256" rx="180" ry="68" 
             fill="none" 
             stroke="url(#orbitGrad2)" 
             stroke-width="14" 
             transform="rotate(45, 256, 256)"
             filter="url(#glow)"
             stroke-linecap="round"/>

    <!-- 'Q' Tail Accent (Quantum Wave / Statevector Vector) -->
    <path d="M 330 330 Q 390 390 440 420" 
          fill="none" 
          stroke="url(#orbitGrad1)" 
          stroke-width="16" 
          stroke-linecap="round"
          filter="url(#intenseGlow)"/>

    <circle cx="440" cy="420" r="10" fill="#22d3ee" filter="url(#glow)"/>

    <!-- Inner Superposition Core / Qubit Nucleus -->
    <circle cx="256" cy="256" r="42" fill="url(#coreGlow)" filter="url(#intenseGlow)"/>
    <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>

    <!-- Orbit Nodes (Qubits / Probability Amplitude Points) -->
    <circle cx="110" cy="180" r="12" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="395" cy="315" r="10" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="310" cy="120" r="11" fill="#f43f5e" filter="url(#glow)"/>
  </g>
</svg>
